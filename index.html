<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Brunux</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23CDB4FF'/%3E%3Ccircle cx='24' cy='28' r='4' fill='%233A2A22'/%3E%3Ccircle cx='40' cy='28' r='4' fill='%233A2A22'/%3E%3Cellipse cx='32' cy='40' rx='6' ry='5' fill='%233A2A22'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=53">
</head>
<body>
  <div id="view"></div>

  <div id="hud" hidden>
    <span id="coin-count">🪙 0</span>
    <span id="gem-count">💎 0</span>
  </div>

  <p id="hint" hidden></p>
  <p id="toast" aria-live="polite"></p>

  <div id="lang" class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="es" aria-label="Español">ES</button>
    <button type="button" data-lang="en" aria-label="English">EN</button>
  </div>
  <button id="mute" class="ghost icon-btn" type="button" aria-label="Mute" title="Mute">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9h3.2L11 5.5v13L7.2 15H4V9z"/>
      <path class="line wave" d="M14.2 8.2a4.4 4.4 0 0 1 0 7.6"/>
      <path class="line wave" d="M16.6 5.8a7.2 7.2 0 0 1 0 12.4"/>
      <path class="line mute-x" d="M14 9.5 19.5 15M19.5 9.5 14 15"/>
    </svg>
  </button>
  <button id="dance" class="ghost label-btn" type="button" data-i18n-label="dance" aria-label="Dance" title="Dance">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
      <ellipse cx="7.2" cy="17.2" rx="2.4" ry="1.8"/>
      <ellipse cx="15.8" cy="15.2" rx="2.4" ry="1.8"/>
      <path class="line" d="M9.6 17V6.2l8.6-1.6V15"/>
      <path class="line" d="M9.6 9.2 18.2 7.6"/>
    </svg>
    <span data-i18n="dance">Dance</span>
  </button>
  <button id="casa" class="ghost icon-btn" type="button" hidden data-i18n-label="home" aria-label="Home" title="Home">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4.5 11.2 12 4.5l7.5 6.7V20h-5.2v-4.8H9.7V20H4.5z"/>
    </svg>
  </button>
  <button id="reset" class="ghost icon-btn" type="button" hidden data-i18n-label="again" aria-label="Again" title="Again">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
      <path class="line" d="M7.2 7.2a7 7 0 1 1-1.4 7.4"/>
      <path d="M7.2 3.6v5H12"/>
    </svg>
  </button>

  <section id="home" class="sheet" hidden>
    <h1>Brunux</h1>
    <div class="purse" id="purse">
      <span id="coins">🪙 0</span>
      <span id="gems">💎 0</span>
    </div>
    <div class="home-actions">
      <button id="dress" type="button" data-i18n="doll">My avatar</button>
      <button id="shop-open" type="button" data-i18n="shop">The shop</button>
    </div>
    <div id="games"></div>
  </section>

  <section id="dresser" class="sheet" hidden>
    <h2 data-i18n="doll">My avatar</h2>
    <p id="dress-note" data-i18n="dress.note">Tap to change how it looks.</p>
    <div id="swatches"></div>
    <button id="dressed" type="button" data-i18n="done">Done</button>
  </section>

  <section id="shop" class="sheet" hidden>
    <h2 data-i18n="shop">The shop</h2>
    <p id="shop-note"></p>
    <div id="catalog"></div>
    <button id="shop-close" type="button" data-i18n="done">Done</button>
  </section>

  <section id="gate" class="card" hidden>
    <div id="gate-art" class="poster" aria-hidden="true">
      <span id="gate-badge" class="badge" hidden>★</span>
      <span class="shape a"></span>
      <span class="shape b"></span>
      <span class="shape c"></span>
      <span class="shape d"></span>
      <span class="shape e"></span>
      <span class="shape f"></span>
    </div>
    <h2 id="gate-title">The Hill</h2>
    <div id="gate-lanes" class="lanes" hidden></div>
    <button id="gate-play" type="button" data-i18n="play">Play</button>
    <button id="gate-back" class="quiet" type="button" data-i18n="notNow">Not now</button>
  </section>

  <section id="board-card" class="card" hidden>
    <h2 data-i18n="board.heading">Your badges</h2>
    <ul id="board-list"></ul>
    <button id="board-back" class="quiet" type="button" data-i18n="close">Close</button>
  </section>

  <section id="win" class="card" hidden>
    <h2 id="win-title">Ball pit!</h2>
    <p id="win-text"></p>
    <button id="replay" type="button" data-i18n="again">Again</button>
    <button id="win-home" class="quiet" type="button" data-i18n="home">Home</button>
  </section>

  <div id="touch" aria-hidden="true">
    <div class="pad">
      <div class="cross" aria-hidden="true"><span></span><span></span></div>
      <button type="button" data-hold="forward" data-i18n-label="forward" aria-label="Forward"><svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14.8 12 8.2l6 6.6" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" data-hold="left" data-i18n-label="left" aria-label="Left"><svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14.8 12 8.2l6 6.6" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" data-hold="back" data-i18n-label="back" aria-label="Back"><svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14.8 12 8.2l6 6.6" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" data-hold="right" data-i18n-label="right" aria-label="Right"><svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14.8 12 8.2l6 6.6" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <button type="button" id="jump" class="jump" data-i18n="jump" data-i18n-label="jump.label" aria-label="Jump">JUMP</button>
  </div>

  <script type="module" src="game.js?v=90"></script>
</body>
</html>
