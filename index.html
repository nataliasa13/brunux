<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Brunux</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23CDB4FF'/%3E%3Ccircle cx='24' cy='28' r='4' fill='%233A2A22'/%3E%3Ccircle cx='40' cy='28' r='4' fill='%233A2A22'/%3E%3Cellipse cx='32' cy='40' rx='6' ry='5' fill='%233A2A22'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=44">
</head>
<body>
  <div id="view"></div>

  <div id="hud" hidden>
    <span id="coin-count">🪙 0</span>
    <span id="gem-count">💎 0</span>
  </div>

  <p id="hint" hidden></p>
  <p id="toast" aria-live="polite"></p>

  <button id="mute" class="ghost icon-btn" type="button" aria-label="Sonido" title="Sonido">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9h3.2L11 5.5v13L7.2 15H4V9z"/>
      <path class="line wave" d="M14.2 8.2a4.4 4.4 0 0 1 0 7.6"/>
      <path class="line wave" d="M16.6 5.8a7.2 7.2 0 0 1 0 12.4"/>
      <path class="line mute-x" d="M14 9.5 19.5 15M19.5 9.5 14 15"/>
    </svg>
  </button>
  <button id="dance" class="ghost label-btn" type="button" aria-label="Bailar" title="Bailar">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
      <ellipse cx="7.2" cy="17.2" rx="2.4" ry="1.8"/>
      <ellipse cx="15.8" cy="15.2" rx="2.4" ry="1.8"/>
      <path class="line" d="M9.6 17V6.2l8.6-1.6V15"/>
      <path class="line" d="M9.6 9.2 18.2 7.6"/>
    </svg>
    <span>Bailar</span>
  </button>
  <button id="casa" class="ghost icon-btn" type="button" hidden aria-label="Casa" title="Casa">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4.5 11.2 12 4.5l7.5 6.7V20h-5.2v-4.8H9.7V20H4.5z"/>
    </svg>
  </button>
  <button id="reset" class="ghost icon-btn" type="button" hidden aria-label="Otra vez" title="Otra vez">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
      <path class="line" d="M7.2 7.2a7 7 0 1 1-1.4 7.4"/>
      <path d="M7.2 3.6v5H12"/>
    </svg>
  </button>

  <section id="home" class="sheet" hidden>
    <h1>Brunux</h1>
    <div class="purse" id="purse">
      <span id="coins">🪙 0</span>
      <span id="gems">💎 0</span>
    </div>
    <div class="home-actions">
      <button id="dress" type="button">Mi muñeco</button>
      <button id="shop-open" type="button">La tienda</button>
    </div>
    <div id="games"></div>
  </section>

  <section id="dresser" class="sheet" hidden>
    <h2>Mi muñeco</h2>
    <p id="dress-note">Toca para cambiar cómo se ve.</p>
    <div id="swatches"></div>
    <button id="dressed" type="button">Listo</button>
  </section>

  <section id="shop" class="sheet" hidden>
    <h2>La tienda</h2>
    <p id="shop-note"></p>
    <div id="catalog"></div>
    <button id="shop-close" type="button">Listo</button>
  </section>

  <section id="gate" class="card" hidden>
    <div id="gate-art" class="poster" aria-hidden="true">
      <span id="gate-badge" class="badge" hidden>★</span>
      <span class="shape a"></span>
      <span class="shape b"></span>
      <span class="shape c"></span>
      <span class="shape d"></span>
      <span class="shape e"></span>
      <span class="shape f"></span>
    </div>
    <h2 id="gate-title">La cuesta</h2>
    <div id="gate-lanes" class="lanes" hidden></div>
    <button id="gate-play" type="button">Jugar</button>
    <button id="gate-back" class="quiet" type="button">Ahora no</button>
  </section>

  <section id="board-card" class="card" hidden>
    <h2>Tus insignias</h2>
    <ul id="board-list"></ul>
    <button id="board-back" class="quiet" type="button">Cerrar</button>
  </section>

  <section id="win" class="card" hidden>
    <h2 id="win-title">¡Piscina de bolas!</h2>
    <p id="win-text"></p>
    <button id="replay" type="button">Otra vez</button>
    <button id="win-home" class="quiet" type="button">Casa</button>
  </section>

  <div id="touch" aria-hidden="true">
    <div class="pad">
      <button type="button" data-hold="left" aria-label="Izquierda">◀</button>
      <div class="nudge">
        <button type="button" data-hold="forward" aria-label="Adelante">▲</button>
        <button type="button" data-hold="back" aria-label="Atrás">▼</button>
      </div>
      <button type="button" data-hold="right" aria-label="Derecha">▶</button>
    </div>
    <button type="button" id="jump" class="jump" aria-label="Saltar">SALTAR</button>
  </div>

  <script type="module" src="game.js?v=77"></script>
</body>
</html>
